name: Generate OKF models

on:
  push:
    branches: [feat/54-generated-okf-models]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python scripts/generate_okf_models.py
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wikiskill/generated/okf_models.py
          if ! git diff --cached --quiet; then
            git commit -m "refactor(types): refresh generated OKF models"
            git push
          fi
