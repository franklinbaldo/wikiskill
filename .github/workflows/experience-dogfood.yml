name: Experience dogfood

on:
  pull_request:
    branches: [main]

jobs:
  record-experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Generate Experience through the runtime
        run: |
          cp -R knowledge .dogfood-knowledge
          uv run python - <<'PY'
          import os
          from datetime import UTC, datetime
          from wikiskill import WikiSkill

          run_id = os.environ["GITHUB_RUN_ID"]
          experience_id = f"exp-pr23-runtime-dogfood-{run_id}"
          ws = WikiSkill.open(".dogfood-knowledge")
          result = ws.record_experience(
              experience_id=experience_id,
              title="Experience Recording dogfood via WikiSkill runtime",
              timestamp=datetime.now(UTC).isoformat().replace("+00:00", "Z"),
              status="success",
              task="Revive PR #23 Experience Recording on the contract-guided runtime",
              context=(
                  "Generated inside GitHub Actions by WikiSkill.record_experience; "
                  f"workflow run {run_id}."
              ),
              run="runs/20260905-contract-guided-runtime",
              body=(
                  "# Experience Recording runtime dogfood\n\n"
                  "## Context & Intent\n"
                  "Prove that the revived Experience Recording feature can generate its own "
                  "OKF learning artifact.\n\n"
                  "## Action & Observed Output\n"
                  "GitHub Actions invoked WikiSkill.record_experience() against a copy of the "
                  "repository knowledge bundle and the runtime accepted the write.\n\n"
                  "## Findings\n"
                  "Experience Recording now closes execution-to-learning provenance by linking "
                  "the generated Experience to its producing LoopRun.\n"
              ),
          )
          print(result["path"])
          PY
          uv run okf-parser check .dogfood-knowledge --require-spec "../specs/{slug}.md" --normative-spec

      - name: Stage generated Experience artifact
        run: |
          mkdir -p dogfood-artifact
          cp .dogfood-knowledge/experiences/exp-pr23-runtime-dogfood-*.md dogfood-artifact/

      - name: Upload generated Experience
        uses: actions/upload-artifact@v4
        with:
          name: wikiskill-experience-dogfood
          path: dogfood-artifact/
