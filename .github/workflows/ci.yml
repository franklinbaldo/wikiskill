name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (Ruff check)
        run: uv run ruff check .

      - name: Format (Ruff format)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Validate OKF Bundle
        run: uv run okf-parser check knowledge/

      - name: Run Pytest
        run: uv run pytest -v