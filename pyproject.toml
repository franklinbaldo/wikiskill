[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikiskill"
dynamic = ["version"]
description = "Contract-guided agent execution and persistent learning runtime built on OKF."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Franklin Silveira Baldo", email = "franklinbaldo@gmail.com" },
]
dependencies = [
    "okf-parser @ git+https://github.com/franklinbaldo/okf-parser.git@14b95cf223cd298c8b52958cd1e71fec27d74a53",
    "ibis-framework[duckdb]>=9.0",
    "duckdb>=1.0",
    "networkx>=3.2",
    "pydantic>=2.7",
    "cyclopts>=4.0",
    "fastmcp>=3.0",
]

[project.scripts]
wikiskill = "wikiskill.cli:app"

[project.urls]
Homepage = "https://github.com/franklinbaldo/wikiskill"
Repository = "https://github.com/franklinbaldo/wikiskill"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "prek>=0.5.1",
    "ty>=0.0.1a0",
    "bandit>=1.8",
    "vulture>=2.14",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "src/wikiskill/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wikiskill"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.vulture]
paths = ["src/wikiskill"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wikiskill --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src/wikiskill"]

[tool.coverage.report]
show_missing = true
fail_under = 80
