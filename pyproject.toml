[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikiskill"
version = "0.1.0"
description = "Persistent agent learning runtime built on OKF: experience -> wiki -> skills -> evaluation -> evolution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Franklin Silveira Baldo", email = "franklinbaldo@gmail.com" },
]
dependencies = [
    "okf-parser>=0.2.14",
    "ibis-framework[duckdb]>=9.0",
    "duckdb>=1.0",
    "networkx>=3.2",
    "pydantic>=2.7",
    "cyclopts>=4.0",
    "fastmcp>=3.0",
]

[project.scripts]
wikiskill = "wikiskill.cli:app"

[project.urls]
Homepage = "https://github.com/franklinbaldo/wikiskill"
Repository = "https://github.com/franklinbaldo/wikiskill"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "prek>=0.5.1",
    "ty>=0.0.1a0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wikiskill"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]